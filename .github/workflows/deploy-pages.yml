name: Deploy ActivaMente Kids to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Rebuild mockup images
        run: |
          cat public/hero450.b64.001 public/hero450.b64.002 public/hero450.b64.003 | base64 --decode > public/hero-mega-mockup.jpg
          cat public/lower500.b64.001 public/lower500.b64.002 public/lower500.b64.003 | base64 --decode > public/mega-mockup-clean.jpg
          test -s public/hero-mega-mockup.jpg
          test -s public/mega-mockup-clean.jpg
      - name: Build
        run: bun run build
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .output/public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
